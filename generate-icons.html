<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Generate PWA Icons</title>
  <style>
    body { font-family: Cairo, sans-serif; text-align: center; padding: 40px; background: #0d1117; color: #e6edf3; }
    button { padding: 12px 24px; font-size: 16px; background: #1a5276; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
    button:hover { background: #2980b9; }
    canvas { display: none; }
    #status { margin-top: 20px; color: #8b949e; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Generate PWA Icons</h1>
  <p>Click the button to generate and download icon-192.png and icon-512.png</p>
  <button onclick="generateIcons()">Generate & Download Icons</button>
  <div id="status"></div>
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>

  <script>
    function generateIcons() {
      const status = document.getElementById('status');
      status.textContent = 'Generating...';

      [192, 512].forEach(size => {
        const canvas = document.getElementById('c' + size);
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#1a5276';
        const r = size * 0.2;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${size * 0.55}px Cairo, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ح', size / 2, size / 2 + size * 0.03);

        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon-${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
          status.textContent = `✅ icon-${size}.png downloaded`;
        });
      });
    }
  </script>
</body>
</html>
